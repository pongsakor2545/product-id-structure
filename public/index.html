<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product ID Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(98% 0.004 260);
    --surface: oklch(100% 0 0);
    --surface-2: oklch(97% 0.006 260);
    --border: oklch(91% 0.007 260);
    --border-strong: oklch(85% 0.01 260);
    --text: oklch(24% 0.02 260);
    --text-muted: oklch(52% 0.02 260);
    --text-faint: oklch(66% 0.015 260);
    --primary: oklch(55% 0.17 265);
    --primary-hover: oklch(48% 0.18 265);
    --primary-tint: oklch(94% 0.03 265);
    --danger: oklch(58% 0.19 25);
    --danger-tint: oklch(95% 0.04 25);
    --success-tint: oklch(95% 0.05 145);
    --success-line: oklch(62% 0.14 145);
    --thai-blue: oklch(48% 0.19 258);
    --shadow-sm: 0 1px 3px rgba(20,20,30,0.08);
    --shadow-md: 0 6px 18px rgba(20,20,30,0.12);
    --shadow-lg: 0 12px 32px rgba(20,20,30,0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(17% 0.012 260); --surface: oklch(21% 0.014 260); --surface-2: oklch(25% 0.016 260);
      --border: oklch(32% 0.017 260); --border-strong: oklch(40% 0.02 260);
      --text: oklch(93% 0.006 260); --text-muted: oklch(70% 0.014 260); --text-faint: oklch(54% 0.014 260);
      --primary: oklch(74% 0.15 265); --primary-hover: oklch(80% 0.13 265); --primary-tint: oklch(30% 0.06 265);
      --danger: oklch(70% 0.17 20); --danger-tint: oklch(30% 0.08 20);
      --success-tint: oklch(28% 0.07 145); --success-line: oklch(65% 0.14 145);
      --thai-blue: oklch(76% 0.13 258);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3); --shadow-md: 0 6px 18px rgba(0,0,0,0.4); --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(17% 0.012 260); --surface: oklch(21% 0.014 260); --surface-2: oklch(25% 0.016 260);
    --border: oklch(32% 0.017 260); --border-strong: oklch(40% 0.02 260);
    --text: oklch(93% 0.006 260); --text-muted: oklch(70% 0.014 260); --text-faint: oklch(54% 0.014 260);
    --primary: oklch(74% 0.15 265); --primary-hover: oklch(80% 0.13 265); --primary-tint: oklch(30% 0.06 265);
    --danger: oklch(70% 0.17 20); --danger-tint: oklch(30% 0.08 20);
    --success-tint: oklch(28% 0.07 145); --success-line: oklch(65% 0.14 145);
    --thai-blue: oklch(76% 0.13 258);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3); --shadow-md: 0 6px 18px rgba(0,0,0,0.4); --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Noto Sans Thai', 'Noto Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
  a { color: var(--primary); }
  button, input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid var(--bg); }
  button:focus-visible, input:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand-title { font-family: 'Sora', 'Noto Sans Thai', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .brand-sub { font-size: 12.5px; color: var(--text-muted); }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; position: relative; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .12s ease, border-color .12s ease; }
  .btn:hover { background: var(--surface-2); }
  .btn.small { height: 30px; padding: 0 10px; font-size: 12.5px; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger-ghost { background: transparent; border: 1px solid var(--border); color: var(--danger); }
  .btn-danger-ghost:hover { background: var(--danger-tint); border-color: var(--danger); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 7px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  .people-anchor { position: relative; }
  .avatar-stack { display: flex; align-items: center; cursor: pointer; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; border: 2px solid var(--surface); margin-left: -8px; font-family: 'Sora', sans-serif; }
  .avatar:first-child { margin-left: 0; }
  .avatar.more { background: var(--surface-2); color: var(--text-muted); border: 2px solid var(--surface); }
  .people-popover { position: absolute; top: 42px; right: 0; width: 260px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 35; }
  .people-row { display: flex; align-items: center; gap: 9px; padding: 6px 2px; }
  .people-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .people-name { flex: 1; font-size: 13px; }
  .people-name-input { flex: 1; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); padding: 0 8px; font-size: 12.5px; color: var(--text); }
  .people-you-tag { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .people-empty { font-size: 12.5px; color: var(--text-muted); padding: 6px 2px; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .conn-dot.on { background: var(--success-line); }
  .conn-dot.off { background: var(--danger); }

  .view-toggle { display: flex; align-items: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; flex-shrink: 0; }
  .view-toggle-btn { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .view-toggle-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

  .share-popover, .ctx-menu { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 30; }
  .share-popover { top: 62px; right: 24px; width: 340px; padding: 16px; }
  .share-title { font-size: 13.5px; font-weight: 600; margin-bottom: 10px; }
  .share-row { display: flex; gap: 8px; }
  .share-link-input { flex: 1; height: 32px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2); padding: 0 10px; font-size: 12.5px; color: var(--text); }
  .share-hint { font-size: 12px; color: var(--text-muted); margin: 10px 0 0; line-height: 1.5; }

  .ctx-overlay { position: fixed; inset: 0; z-index: 29; }
  .ctx-menu { padding: 5px; display: flex; flex-direction: column; min-width: 160px; }
  .ctx-item { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 10px; border: none; background: transparent; border-radius: 6px; font-size: 13px; color: var(--text); cursor: pointer; text-align: left; width: 100%; }
  .ctx-item:hover { background: var(--surface-2); }
  .ctx-item.danger { color: var(--danger); }
  .ctx-item.danger:hover { background: var(--danger-tint); }
  .ctx-item.disabled { opacity: 0.4; cursor: not-allowed; }

  .main { flex: 1; display: flex; min-height: 0; }
  .tree-wrap, .mindmap-wrap { flex: 1; overflow: auto; padding: 20px 28px 60px; min-width: 0; position: relative; }
  .mindmap-wrap { cursor: grab; user-select: none; }
  .mindmap-wrap:active { cursor: grabbing; }
  .tree-tip { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 13px; margin-bottom: 18px; }
  .legend { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-faint); background: var(--surface); border: 1.5px solid var(--border); border-radius: 999px; padding: 5px 12px 5px 9px; cursor: pointer; transition: opacity .12s ease, border-color .12s ease; opacity: 0.55; }
  .legend-item:hover { opacity: 0.85; }
  .legend-item.active { color: var(--text); border-color: var(--border-strong); opacity: 1; box-shadow: var(--shadow-sm); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .tree { display: flex; flex-direction: column; }
  .row-wrap { display: flex; align-items: stretch; }
  .guide-col { position: relative; width: 24px; height: 60px; flex-shrink: 0; }
  .row-content { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; height: 60px; padding: 0 8px 0 2px; border-radius: 8px; cursor: pointer; }
  .chevron-btn { width: 22px; height: 22px; flex-shrink: 0; border: none; background: transparent; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: var(--text-faint); cursor: pointer; }
  .chevron-btn:hover { background: rgba(120,120,140,0.14); color: var(--text); }
  .chevron-btn svg { transition: transform .12s ease; }
  .chevron-spacer { width: 22px; flex-shrink: 0; }
  .thumb-img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--surface-2); }
  .thumb-fallback { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; color: white; font-family: 'Sora', sans-serif; }
  .node-name-stack { display: flex; flex-direction: column; gap: 1px; flex: 0 1 auto; min-width: 0; }
  .node-name { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-translation { font-size: 11.5px; color: var(--thai-blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .level-badge { font-family: 'Sora', sans-serif; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px; flex-shrink: 0; letter-spacing: 0.02em; }
  .child-count { font-size: 11px; color: var(--text-faint); background: var(--surface-2); border-radius: 5px; padding: 1px 6px; flex-shrink: 0; }
  .row-spacer { flex: 1; min-width: 4px; }
  .row-actions { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity .1s ease; flex-shrink: 0; }
  .row-wrap:hover .row-actions { opacity: 1; }
  .grip { color: var(--text-faint); cursor: grab; display: flex; align-items: center; }

  .panel { width: 380px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; }
  .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }
  .breadcrumb { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .panel-body { padding: 18px; display: flex; flex-direction: column; gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .field input[type="text"], .field textarea { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 13.5px; color: var(--text); background: var(--surface); width: 100%; }
  .field input[type="text"]:focus, .field textarea:focus { outline: 2px solid var(--primary-tint); border-color: var(--primary); }
  .field textarea { min-height: 76px; resize: none; overflow-y: hidden; line-height: 1.5; }
  .name-input { font-size: 15.5px !important; font-weight: 600; font-family: 'Sora', 'Noto Sans Thai', sans-serif; }
  .level-row { display: flex; align-items: center; gap: 10px; }
  .muted { font-size: 12.5px; color: var(--text-muted); }
  .image-upload { display: flex; align-items: center; gap: 12px; }
  .image-preview { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--surface-2); }
  .image-fallback { width: 56px; height: 56px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; color: white; font-family: 'Sora', sans-serif; }
  .panel-actions { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px solid var(--border); }
  .panel-actions .btn { width: 100%; justify-content: center; }

  .mindmap-canvas { position: relative; cursor: crosshair; }
  .mind-card { position: absolute; width: 212px; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 13px; box-shadow: var(--shadow-sm); cursor: pointer; min-height: 44px; transition: box-shadow .12s ease, border-color .12s ease; }
  .mind-card:hover { box-shadow: var(--shadow-md); }
  .mind-card.selected { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
  .mind-card.dragover { border-color: var(--success-line); outline: 1.5px dashed var(--success-line); outline-offset: -2px; }
  .mind-card.dragging { opacity: 0.4; }
  .mind-card .thumb-img, .mind-card .thumb-fallback { width: 42px; height: 42px; border-radius: 10px; font-size: 16px; flex-shrink: 0; }
  .mind-text-stack { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .mind-en { font-family: 'Sora', 'Noto Sans Thai', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--text); line-height: 1.3; overflow-wrap: break-word; word-break: break-word; }
  .mind-th { font-size: 10.5px; font-weight: 400; color: var(--thai-blue); line-height: 1.35; overflow-wrap: break-word; word-break: break-word; }
  .mind-level-tag { position: absolute; top: -9px; left: 13px; font-family: 'Sora', sans-serif; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.02em; box-shadow: var(--shadow-sm); border: 1.5px solid var(--surface); }
  .mind-toggle-pill { position: absolute; right: -11px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--border-strong); font-size: 10.5px; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; }
  .mind-toggle-pill:hover { background: var(--surface-2); }
  .mind-add-btn { position: absolute; right: -11px; bottom: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); border: none; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity .1s ease; z-index: 2; }
  .mind-card:hover .mind-add-btn { opacity: 1; }

  .mind-text-annotation { position: absolute; background: transparent; border: 1px dashed transparent; border-radius: 4px; padding: 3px 6px; font-family: 'Noto Sans Thai', sans-serif; min-width: 40px; min-height: 20px; cursor: text; overflow: auto; }
  .mind-text-annotation:hover, .mind-text-annotation:focus { border-color: var(--border-strong); background: var(--surface); outline: none; }
  .mind-resize-handle { position: absolute; right: -4px; bottom: -4px; width: 12px; height: 12px; border-radius: 3px; background: var(--primary); cursor: nwse-resize; opacity: 0; transition: opacity .1s ease; z-index: 3; }
  .mind-text-annotation:hover + .mind-resize-handle, .mind-resize-handle:hover, .mind-resize-handle.active { opacity: 1; }

  .zoom-controls { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-md); z-index: 5; display: flex; align-items: center; gap: 2px; padding: 4px; }
  .zoom-label { font-size: 12px; color: var(--text-muted); width: 42px; text-align: center; font-family: 'Sora', sans-serif; }
  .draw-toolbar { display: inline-flex; flex-direction: column; gap: 8px; padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-md); margin-bottom: 16px; }
  .draw-tool-row { display: flex; gap: 4px; }
  .draw-tool-btn { width: 34px; height: 34px; border-radius: 8px; border: none; background: transparent; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .draw-tool-btn:hover { background: var(--surface-2); }
  .draw-tool-btn.active { background: var(--primary-tint); color: var(--primary); }
  .draw-settings { display: flex; flex-direction: column; gap: 9px; padding-top: 8px; border-top: 1px solid var(--border); }
  .draw-swatches { display: flex; gap: 5px; flex-wrap: wrap; max-width: 108px; }
  .draw-swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .draw-size-row { display: flex; align-items: center; gap: 8px; }
  .draw-size-row input[type="range"] { width: 88px; }
  .draw-size-label { font-size: 11px; color: var(--text-muted); width: 30px; font-family: 'Sora', sans-serif; }

  .sheet-tabs { display: flex; align-items: center; gap: 4px; padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; }
  .sheet-tab { height: 30px; padding: 0 14px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--text-muted); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .sheet-tab:hover { background: var(--surface-2); }
  .sheet-tab.active { background: var(--primary-tint); color: var(--primary); }
  .sheet-tab-input { height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--primary); font-size: 12.5px; width: 120px; flex-shrink: 0; background: var(--surface); color: var(--text); }
  .sheet-add-btn { width: 28px; height: 28px; border-radius: 7px; border: 1px dashed var(--border-strong); background: transparent; color: var(--text-muted); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .sheet-add-btn:hover { background: var(--surface-2); color: var(--text); }

  .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow-md); z-index: 40; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function () {
  var LEVEL_HUE_BASE = 265;
  var LEVEL_HUE_STEP = 137.508; // golden angle: spaces hues around the wheel so no two levels ever land on the same color, however deep the tree goes
  var DRAW_PALETTE = ['#1d1d1f', '#e11d48', '#2563eb', '#16a34a', '#f59e0b', '#7c3aed'];

  function isDarkMode() {
    var override = document.documentElement.getAttribute('data-theme');
    if (override === 'dark') return true;
    if (override === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function hueForLevel(level) {
    return (LEVEL_HUE_BASE + (level - 1) * LEVEL_HUE_STEP) % 360;
  }
  function colorForLevel(level) {
    var hue = hueForLevel(level);
    if (isDarkMode()) return { solid: 'oklch(68% 0.15 ' + hue + ')', tintBg: 'oklch(30% 0.08 ' + hue + ')', tintText: 'oklch(85% 0.06 ' + hue + ')' };
    return { solid: 'oklch(58% 0.15 ' + hue + ')', tintBg: 'oklch(93% 0.035 ' + hue + ')', tintText: 'oklch(36% 0.11 ' + hue + ')' };
  }
  function initialOf(name) { return (name || '?').trim().charAt(0).toUpperCase(); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var myClientId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()));
  var myName = (function () { try { return localStorage.getItem('pid-my-name') || ''; } catch (e) { return ''; } })() || ('Guest ' + Math.floor(100 + Math.random() * 900));
  var myColor = DRAW_PALETTE[Math.floor(Math.random() * DRAW_PALETTE.length)];
  function setMyName(name) {
    myName = (name || '').trim() || ('Guest ' + Math.floor(100 + Math.random() * 900));
    try { localStorage.setItem('pid-my-name', myName); } catch (e) {}
    if (state.activeSheetId) wsSend({ type: 'presence', patch: { name: myName } });
    render();
  }

  function api(method, url, body) {
    var opts = { method: method, headers: { 'X-Client-Id': myClientId } };
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }

      '<div class="zoom-controls"><button class="icon-btn" data-act="zoom-out"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button><span class="zoom-label">' + Math.round(state.zoom * 100) + '%</span><button class="icon-btn" data-act="zoom-in"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button class="icon-btn" data-act="zoom-reset" title="รีเซ็ตซูม"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3.5 7.1M3 12v5h5"/></svg></button></div>' +
      '</div>';
  }

  function breadcrumbFor(id) {
    var parts = []; var n = nodesById.get(id);
    while (n) { parts.unshift(n.name); n = n.parentId ? nodesById.get(n.parentId) : null; }
    return parts.join(' / ');
  }
  function renderPanel() {
    var node = state.selectedId ? nodesById.get(state.selectedId) : null;
    if (!node) return '';
    var colors = colorForLevel(node.level);
    var hasImage = !!imageSrc(node);
    var imageBlock = hasImage ? '<img class="image-preview" src="' + esc(imageSrc(node)) + '" />' : '<div class="image-fallback" style="background:' + colors.solid + '">' + siblingIndexOf(node) + '</div>';
    return '<div class="panel"><div class="panel-header"><div class="breadcrumb">' + esc(breadcrumbFor(node.id)) + '</div><button class="icon-btn" data-act="close-panel"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="panel-body">' +
      '<div class="field"><label>ชื่อหมวดหมู่ (English)</label><input class="name-input" type="text" value="' + esc(node.name) + '" data-field="name" /></div>' +
      '<div class="level-row"><span class="level-badge" style="background:' + colors.tintBg + ';color:' + colors.tintText + '">L' + node.level + '</span><span class="muted">' + (node.childCount ? node.childCount + ' หมวดย่อย' : 'ยังไม่มีหมวดย่อย') + '</span></div>' +
      '<div class="field"><label>รูปภาพหมวดหมู่</label><div class="image-upload">' + imageBlock + '<label class="btn btn-ghost small" for="pid-img-upload">เปลี่ยนรูปภาพ</label><input id="pid-img-upload" type="file" accept="image/*" style="display:none" data-act="image-change" />' + (hasImage ? '<button class="btn btn-danger-ghost small" data-act="image-delete">ลบรูปภาพ</button>' : '') + '</div></div>' +
      '<div class="field"><label>คำนิยาม (Definition)</label><textarea data-field="definition" placeholder="อธิบายว่าหมวดหมู่นี้ครอบคลุมสินค้าประเภทใดบ้าง...">' + esc(node.definition) + '</textarea></div>' +
      '<div class="field"><label>คำแปล (ภาษาไทย)</label><input type="text" value="' + esc(node.translation) + '" data-field="translation" placeholder="เช่น สมาร์ทโฟน" /></div>' +
      '<div class="panel-actions"><button class="btn btn-primary" data-act="add-sub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>เพิ่มหมวดย่อยของหมวดนี้</button><button class="btn btn-danger-ghost" data-act="delete-selected">ลบหมวดหมู่นี้</button></div>' +
      '</div></div>';
  }

  function renderSheetTabs() {
    var tabs = state.sheets.map(function (s) {
      if (state.renamingSheetId === s.id) return '<input class="sheet-tab-input" id="sheetRenameInput" value="' + esc(state.renameDraft) + '" data-act="rename-input" />';
      return '<button class="sheet-tab' + (s.id === state.activeSheetId ? ' active' : '') + '" data-act="switch-sheet" data-id="' + s.id + '" data-dblact="start-rename" data-ctxact="sheet-ctx">' + esc(s.name) + '</button>';
    }).join('');
    return '<div class="sheet-tabs">' + tabs + '<button class="sheet-add-btn" data-act="add-sheet" title="เพิ่มชีทใหม่"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>';
  }
  function renderSheetCtxMenu() {
    if (!state.contextMenuSheetId) return '';
    var canDelete = state.sheets.length > 1;
    return '<div class="ctx-overlay" data-act="close-sheet-ctx"></div><div class="ctx-menu" style="left:' + state.contextMenuX + 'px;bottom:50px;">' +
      '<button class="ctx-item" data-act="sheet-rename"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>เปลี่ยนชื่อ</button>' +
      '<button class="ctx-item" data-act="sheet-duplicate"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>คัดลอกชีท</button>' +
      '<button class="ctx-item danger' + (canDelete ? '' : ' disabled') + '" data-act="sheet-delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0-1 13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 7"/></svg>ลบชีท</button></div>';
  }
  function renderAnnoCtxMenu() {
    if (!state.annoCtx) return '';
    var label = state.annoCtx.type === 'drawing' ? 'เส้นนี้' : 'ข้อความนี้';
    return '<div class="ctx-overlay" data-act="close-anno-ctx"></div><div class="ctx-menu" style="left:' + state.annoCtx.x + 'px;top:' + state.annoCtx.y + 'px;">' +
      '<button class="ctx-item danger" data-act="anno-delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0-1 13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 7"/></svg>ลบ' + label + '</button></div>';
  }
  function renderPeoplePopover(others) {
    var body = '<div class="people-row"><span class="people-dot" style="background:' + esc(myColor) + '"></span><input class="people-name-input" type="text" maxlength="30" value="' + esc(myName) + '" data-act="my-name-input" placeholder="ชื่อของคุณ" /><span class="people-you-tag">คุณ</span></div>';
    body += others.length
      ? others.map(function (p) { return '<div class="people-row"><span class="people-dot" style="background:' + esc(p.color || '#888') + '"></span><span class="people-name">' + esc(p.name || 'Guest') + '</span></div>'; }).join('')
      : '<div class="people-empty">ยังไม่มีคนอื่นออนไลน์</div>';
    return '<div class="people-popover"><div class="share-title">ผู้ใช้งานออนไลน์ (' + (others.length + 1) + ')</div>' + body + '</div>';
  }

  function renderApp() {
    var prevScrollEl = app.querySelector('.tree-wrap, .mindmap-wrap');
    var prevScrollLeft = prevScrollEl ? prevScrollEl.scrollLeft : 0;
    var prevScrollTop = prevScrollEl ? prevScrollEl.scrollTop : 0;
    var others = (state.peers || []).filter(function (p) { return p.clientId !== myClientId; });
    var stackPeople = [{ color: myColor, name: myName }].concat(others);
    var avatarsHtml = stackPeople.slice(0, 4).map(function (p) { return '<div class="avatar" style="background:' + esc(p.color || '#888') + '" title="' + esc(p.name || 'Guest') + '">' + esc(initialOf(p.name)) + '</div>'; }).join('') + (stackPeople.length > 4 ? '<div class="avatar more">+' + (stackPeople.length - 4) + '</div>' : '');
    var onlineCount = others.length + 1;
    var html = '<div class="topbar">' +
      '<div class="brand"><div class="brand-title">โครงสร้าง Product ID</div><div class="brand-sub"><span class="conn-dot ' + (state.wsConnected ? 'on' : 'off') + '"></span>' + (state.wsConnected ? onlineCount + ' คนออนไลน์' : 'ขาดการเชื่อมต่อ กำลังลองใหม่...') + '</div></div>' +
      '<div class="view-toggle">' +
      '<button class="view-toggle-btn' + (state.viewMode === 'tree' ? ' active' : '') + '" data-act="set-view" data-view="tree"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>มุมมองรายการ</button>' +
      '<button class="view-toggle-btn' + (state.viewMode === 'mind' ? ' active' : '') + '" data-act="set-view" data-view="mind"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="12" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M7.2 11.3L15.8 6.7M7.4 12h8.2M7.2 12.7l8.6 4.6"/></svg>มุมมองผัง</button></div>' +
      '<div class="topbar-right">' +
      '<button class="btn" data-act="download-excel" title="ดาวน์โหลด Excel ของกิ่งที่โหลดอยู่"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13m0 0l-4-4m4 4l4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>ดาวน์โหลด Excel</button>' +
      '<button class="btn btn-primary" data-act="add-root"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>เพิ่มหมวดหมู่หลัก</button>' +
      '<div class="people-anchor"><div class="avatar-stack" data-act="toggle-people" title="ดูรายชื่อผู้ใช้งานออนไลน์">' + avatarsHtml + '</div>' + (state.peopleOpen ? renderPeoplePopover(others) : '') + '</div>' +
      '<button class="btn" data-act="toggle-share"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-3.8M8.6 13.4l6.8 3.8"/></svg>แชร์</button>' +
      (state.shareOpen ? '<div class="share-popover"><div class="share-title">แชร์ผังโครงสร้างนี้</div><div class="share-row"><input class="share-link-input" type="text" readonly value="' + esc(location.href) + '" /><button class="btn btn-primary small" data-act="copy-link">' + (state.copied ? 'คัดลอกแล้ว!' : 'คัดลอกลิงก์') + '</button></div><p class="share-hint">ทุกคนที่มีลิงก์นี้เข้าแก้ไขและเห็นการเปลี่ยนแปลงแบบเรียลไทม์ได้ (ไม่มีระบบล็อกอิน)</p></div>' : '') +
      '</div></div>' +
      '<div class="main">' + (state.viewMode === 'tree' ? renderTreeView() : renderMindView()) + renderPanel() + '</div>' +
      renderSheetTabs() + renderSheetCtxMenu() + renderAnnoCtxMenu() +
      (state.toast ? '<div class="toast">' + esc(state.toast) + '</div>' : '');
    app.innerHTML = html;
    var newScrollEl = app.querySelector('.tree-wrap, .mindmap-wrap');
    if (newScrollEl) { newScrollEl.scrollLeft = prevScrollLeft; newScrollEl.scrollTop = prevScrollTop; }
    if (state.renamingSheetId) { var inp = document.getElementById('sheetRenameInput'); if (inp) { inp.focus(); inp.select(); } }
    var defTextarea = app.querySelector('textarea[data-field="definition"]');
    if (defTextarea) { defTextarea.style.height = 'auto'; defTextarea.style.height = defTextarea.scrollHeight + 'px'; }
  }
  var render = renderApp;

  // ---------- event delegation ----------
  app.addEventListener('mousedown', function (e) {
    var wrapEl = document.getElementById('mindWrap');
    var canvasEl = document.getElementById('mindCanvas');
    var resizeHandle = e.target.closest('[data-resize-id]');
    if (resizeHandle) { handleResizeMouseDown(e, resizeHandle.getAttribute('data-resize-id')); return; }
    var textEl = e.target.closest('[data-text-id]');
    if (textEl) { handleTextMouseDown(e, textEl.getAttribute('data-text-id')); return; }
    var drawEl = e.target.closest('[data-draw-id]');
    if (drawEl && canvasEl) { handleDrawMouseDown(e, drawEl.getAttribute('data-draw-id'), canvasEl); return; }
    if (e.target.closest && e.target.closest('[data-act="text-color"]')) { e.preventDefault(); return; }
    if (!wrapEl || !canvasEl || !wrapEl.contains(e.target)) return;
    if (!isBackgroundTarget(e, wrapEl, canvasEl)) return;
    if (state.selectedId) {
      state.selectedId = null;
      render();
      wrapEl = document.getElementById('mindWrap');
      canvasEl = document.getElementById('mindCanvas');
      if (!wrapEl || !canvasEl) return;
    }
    if (state.tool === 'pencil') startStroke(e, canvasEl);
    else if (state.tool === 'text') placeText(e, canvasEl);
    else startPan(e, wrapEl);
  });

  app.addEventListener('wheel', function (e) {
    if (!e.ctrlKey) return;
    var wrapEl = document.getElementById('mindWrap');
    if (!wrapEl || !wrapEl.contains(e.target)) return;
    e.preventDefault();
    var delta = e.deltaY > 0 ? -0.08 : 0.08;
    state.zoom = Math.max(0.5, Math.min(1.6, Math.round((state.zoom + delta) * 100) / 100));
    render();
  }, { passive: false });

  app.addEventListener('dragstart', function (e) {
    var el = e.target.closest('[data-drag-id]');
    if (!el || state.tool !== 'pointer') { e.preventDefault(); return; }
    state.draggingId = el.getAttribute('data-drag-id');
    e.dataTransfer.effectAllowed = 'move';
  });
  app.addEventListener('dragover', function (e) {
    var el = e.target.closest('[data-drag-id]'); if (!el) return;
    e.preventDefault();
    var id = el.getAttribute('data-drag-id');
    if (state.dragOverId !== id) { state.dragOverId = id; render(); }
  });
  app.addEventListener('drop', function (e) {
    var el = e.target.closest('[data-drag-id]'); if (!el) return;
    e.preventDefault(); handleDrop(el.getAttribute('data-drag-id'));
  });
  app.addEventListener('dragend', function () { state.draggingId = null; state.dragOverId = null; render(); });

  app.addEventListener('input', function (e) {
    var field = e.target.getAttribute && e.target.getAttribute('data-field');
    if (field) {
      updateSelected(field, e.target.value);
      var selStart = e.target.selectionStart, selEnd = e.target.selectionEnd, restored = app.querySelector('[data-field="' + field + '"]');
      if (restored && restored !== e.target) { restored.focus(); if (typeof selStart === 'number' && restored.setSelectionRange) { try { restored.setSelectionRange(selStart, selEnd); } catch (er) {} } }
      return;
    }
    var textId = e.target.getAttribute && e.target.getAttribute('data-text-id');
    if (textId) { var t = state.texts.find(function (x) { return x.id === textId; }); if (t) { t.content = e.target.innerHTML; clearTimeout(patchTimers[textId]); patchTimers[textId] = setTimeout(function () { api('PATCH', '/api/texts/' + textId, { content: t.content }).catch(function () {}); }, 500); } return; }
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'pencil-size') {
      state.pencilSize = Number(e.target.value);
      var pencilLabel = e.target.parentNode && e.target.parentNode.querySelector('.draw-size-label');
      if (pencilLabel) pencilLabel.textContent = state.pencilSize + 'px';
    }
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'text-size') {
      state.textSize = Number(e.target.value);
      var textLabel = e.target.parentNode && e.target.parentNode.querySelector('.draw-size-label');
      if (textLabel) textLabel.textContent = state.textSize + 'px';
    }
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'rename-input') state.renameDraft = e.target.value;
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'my-name-input') myName = e.target.value;
  });

  app.addEventListener('blur', function (e) {
    var textId = e.target.getAttribute && e.target.getAttribute('data-text-id');
    if (textId && !e.target.textContent.trim()) { state.texts = state.texts.filter(function (x) { return x.id !== textId; }); render(); api('DELETE', '/api/texts/' + textId).catch(function () {}); }
  }, true);

  app.addEventListener('keydown', function (e) {
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'rename-input' && e.key === 'Enter') e.target.blur();
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'my-name-input' && e.key === 'Enter') e.target.blur();
  });
  app.addEventListener('focusout', function (e) {
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'rename-input') commitRenameSheet();
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'my-name-input') setMyName(e.target.value);
  });
  app.addEventListener('change', function (e) {
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'image-change') handleImageChange(e.target.files && e.target.files[0]);
  });

  app.addEventListener('dblclick', function (e) {
    var el = e.target.closest('[data-dblact="start-rename"]');
    if (el) { state.renamingSheetId = el.getAttribute('data-id'); state.renameDraft = el.textContent; render(); }
  });

  app.addEventListener('contextmenu', function (e) {
    var sheetEl = e.target.closest('[data-ctxact="sheet-ctx"]');
    if (sheetEl) { e.preventDefault(); state.contextMenuSheetId = sheetEl.getAttribute('data-id'); state.contextMenuX = e.clientX; render(); return; }
    var textEl = e.target.closest('[data-text-id]');
    if (textEl) { e.preventDefault(); state.annoCtx = { type: 'text', id: textEl.getAttribute('data-text-id'), x: e.clientX, y: e.clientY }; render(); return; }
    var drawEl = e.target.closest('[data-draw-id]');
    if (drawEl) { e.preventDefault(); state.annoCtx = { type: 'drawing', id: drawEl.getAttribute('data-draw-id'), x: e.clientX, y: e.clientY }; render(); return; }
  });

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    switch (act) {
      case 'toggle-collapse': toggleCollapse(id); break;
      case 'select-node': if (state.tool === 'pointer') { state.selectedId = id; render(); } break;
      case 'add-child': addChild(id); break;
      case 'delete-node': deleteNode(id); break;
      case 'set-view': state.viewMode = el.getAttribute('data-view'); render(); break;
      case 'toggle-level-filter': {
        var lvl = Number(el.getAttribute('data-level'));
        if (state.hiddenLevels.has(lvl)) state.hiddenLevels.delete(lvl); else state.hiddenLevels.add(lvl);
        render();
        break;
      }
      case 'download-excel': downloadCurrentViewAsExcel(); break;
      case 'add-root': addChild(null); break;
      case 'toggle-share': state.shareOpen = !state.shareOpen; render(); break;
      case 'toggle-people': state.peopleOpen = !state.peopleOpen; render(); break;
      case 'copy-link': try { navigator.clipboard.writeText(location.href); } catch (er) {} state.copied = true; render(); setTimeout(function () { state.copied = false; render(); }, 1500); break;
      case 'close-panel': state.selectedId = null; render(); break;
      case 'image-delete': handleImageDelete(); break;
      case 'add-sub': if (state.selectedId) addChild(state.selectedId); break;
      case 'delete-selected': if (state.selectedId) deleteNode(state.selectedId); break;
      case 'switch-sheet': switchSheet(id); break;
      case 'add-sheet': addSheet(); break;
      case 'close-sheet-ctx': state.contextMenuSheetId = null; render(); break;
      case 'sheet-rename': {
        var rsh = state.sheets.find(function (s) { return s.id === state.contextMenuSheetId; });
        if (rsh) { state.renamingSheetId = rsh.id; state.renameDraft = rsh.name; }
        state.contextMenuSheetId = null;
        render();
        break;
      }
      case 'sheet-duplicate': if (state.contextMenuSheetId) duplicateSheet(state.contextMenuSheetId); break;
      case 'sheet-delete': if (state.contextMenuSheetId && state.sheets.length > 1) deleteSheet(state.contextMenuSheetId); break;
      case 'close-anno-ctx': state.annoCtx = null; render(); break;
      case 'anno-delete':
        if (state.annoCtx) {
          if (state.annoCtx.type === 'drawing') { state.drawings = state.drawings.filter(function (d) { return d.id !== state.annoCtx.id; }); api('DELETE', '/api/drawings/' + state.annoCtx.id).catch(function () {}); }
          else { state.texts = state.texts.filter(function (t) { return t.id !== state.annoCtx.id; }); api('DELETE', '/api/texts/' + state.annoCtx.id).catch(function () {}); }
          state.annoCtx = null; render();
        }
        break;
      case 'set-tool': state.tool = el.getAttribute('data-tool'); render(); break;
      case 'pencil-color': state.pencilColor = el.getAttribute('data-color'); render(); break;
      case 'text-color': applyTextColor(el.getAttribute('data-color')); break;
      case 'zoom-in': state.zoom = Math.min(1.6, Math.round((state.zoom + 0.1) * 100) / 100); render(); break;
      case 'zoom-out': state.zoom = Math.max(0.5, Math.round((state.zoom - 0.1) * 100) / 100); render(); break;
      case 'zoom-reset': state.zoom = 1; render(); break;
    }
  });

  loadSheetsList().catch(function () { showToast('โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าเว็บ'); render(); });
  connectWs();
})();
</script>
</body>
</html>
