services:
  - type: web
    name: product-id-structure
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: product-id-db
          property: connectionString
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: product-id-db
    plan: starter
